workflows:
  doomgram:
    name: DoomGram IPA
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      vars:
        # Set API_ID and API_HASH in the Codemagic UI (Environment variables).
        # They are the values from https://my.telegram.org/apps
    scripts:
      - name: Submodules
        script: |
          set -e
          sed -i '' 's|url=\.\./|url=https://github.com/TelegramMessenger/|g' .gitmodules
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1
      - name: Apply DoomGram patch and branding
        script: |
          set -e
          git apply patches/*.patch
          python3 giftcam/apply_branding.py
      - name: Select Xcode
        script: |
          set -e
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
      - name: Signing and configuration
        script: |
          set -e
          test -n "$API_ID"
          test -n "$API_HASH"
          mkdir -p build-input
          cat > build-input/configuration.json <<EOF
          {"bundle_id":"ph.telegra.Telegraph","api_id":"${API_ID}","api_hash":"${API_HASH}","team_id":"C67CF9S4VU","is_internal_build":"true","is_appstore_build":"false","appstore_id":"0","app_specific_url_scheme":"tg","premium_iap_product_id":"","enable_siri":false,"enable_icloud":false}
          EOF
          KEYCHAIN=build.keychain
          KEYCHAIN_PASSWORD=temp123
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security import build-system/fake-codesigning/certs/SelfSigned.p12 -k "$KEYCHAIN" -P "" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          IDENTITY=$(openssl pkcs12 -in build-system/fake-codesigning/certs/SelfSigned.p12 -passin pass: -nokeys -legacy | openssl x509 -noout -subject -nameopt oneline | sed -n 's/.*CN *= *//p' | cut -d, -f1)
          cd build-system/fake-codesigning/profiles
          for f in *.mobileprovision; do
            security cms -D -i "$f" -o /tmp/giftcam-profile.plist
            plutil -replace ExpirationDate -date "2027-10-30T17:06:30Z" /tmp/giftcam-profile.plist
            plutil -remove DER-Encoded-Profile /tmp/giftcam-profile.plist || true
            security cms -S -k "$KEYCHAIN" -N "$IDENTITY" -i /tmp/giftcam-profile.plist -o "$f"
          done
          cd "$CM_BUILD_DIR"
      - name: Build IPA
        script: |
          set -e
          python3 build-system/Make/Make.py \
            --cacheDir="$CM_BUILD_DIR/bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-input/configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=${BUILD_NUMBER:-1} \
            --outputBuildArtifactsPath=build-output
    artifacts:
      - build-output/**/*.ipa
