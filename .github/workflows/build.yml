name: Build GiftCam IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 1

      # Forks break relative submodule URLs (../foo.git -> imfated/foo.git),
      # so point them back at the TelegramMessenger org before init.
      - name: Init submodules
        run: |
          sed -i '' 's|url=\.\./|url=https://github.com/TelegramMessenger/|g' .gitmodules
          git submodule sync --recursive
          git submodule update --init --recursive --depth 1

      - name: Apply GiftCam patches
        run: git apply patches/*.patch

      - name: Select latest Xcode
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE_PATH"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version

      - name: Free disk space
        run: |
          sudo rm -rf /Applications/Xcode_1*.app || true
          sudo rm -rf "$ANDROID_HOME" /usr/local/share/dotnet ~/Library/Android || true
          df -h /

      # team_id/bundle_id must match the identifiers baked into
      # build-system/fake-codesigning profiles (C67CF9S4VU.ph.telegra.Telegraph),
      # otherwise Make.py rejects the profiles (aps-environment check).
      - name: Generate configuration
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          mkdir -p build-input
          cat > build-input/configuration.json <<EOF
          {"bundle_id":"ph.telegra.Telegraph","api_id":${API_ID},"api_hash":"${API_HASH}","team_id":"C67CF9S4VU","is_internal_build":true,"is_appstore_build":false,"appstore_id":0,"app_specific_url_scheme":"tg","premium_iap_product_id":"","enable_siri":false,"enable_icloud":false}
          EOF
          cat build-input/configuration.json

      # Fake profiles expire 2026-10-30. Editing the CMS blob in place breaks
      # its signature (Make.py runs openssl -verify), so instead: extract the
      # plist, bump the date, and re-sign the envelope with a throwaway cert.
      - name: Refresh fake profile dates
        run: |
          set -e
          cd build-system/fake-codesigning/profiles
          openssl req -x509 -newkey rsa:2048 -keyout /tmp/giftcam-key.pem -out /tmp/giftcam-cert.pem -days 365 -nodes -subj "/CN=GiftCam Fake Signing"
          for f in *.mobileprovision; do
            openssl smime -inform der -verify -noverify -in "$f" -out /tmp/giftcam-profile.plist
            perl -pi -e 's/2026-10-30T17:06:30/2027-10-30T17:06:30/g' /tmp/giftcam-profile.plist
            openssl smime -sign -binary -nodetach -in /tmp/giftcam-profile.plist -signer /tmp/giftcam-cert.pem -inkey /tmp/giftcam-key.pem -outform der -out "$f"
          done

      - name: Build IPA
        run: |
          python3 build-system/Make/Make.py \
            --cacheDir="$RUNNER_TEMP/tg-bazel-cache" \
            --overrideXcodeVersion \
            build \
            --configurationPath=build-input/configuration.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber=${{ github.run_number }} \
            --outputBuildArtifactsPath=build-output

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GiftCam-IPA
          path: build-output/**/*.ipa
